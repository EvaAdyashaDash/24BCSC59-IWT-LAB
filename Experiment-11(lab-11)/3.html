<html>
<head>
    <title>Featured Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            margin: auto;
            text-align: center;
        }

        .product-row {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .product-card {
            width: 23%;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 150px;
        }

        .product-card h3 {
            margin: 10px 0;
        }

        .product-card p {
            font-size: 18px;
            color: green;
        }

        .product-card button {
            padding: 8px 12px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .product-card button:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Featured Products</h2>

    <div class="product-row">

        <div class="product-card">
            <img src="product1.jpg" alt="Product 1">
            <h3>Product 1</h3>
            <p>₹999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="product2.jpg" alt="Product 2">
            <h3>Product 2</h3>
            <p>₹1499</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="product3.jpg" alt="Product 3">
            <h3>Product 3</h3>
            <p>₹1999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="product4.jpg" alt="Product 4">
            <h3>Product 4</h3>
            <p>₹2499</p>
            <button>Add to Cart</button>
        </div>

    </div>
</div>

</body>
</html>
