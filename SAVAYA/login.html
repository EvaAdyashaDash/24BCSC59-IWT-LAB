<!DOCTYPE html>
<html>

<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-image" style="display: flex; flex-direction: column; min-height: 100vh; margin: 0;">
  <div id="notLoggedAlert"
    style="display: none; background: pink; color: white; text-align: center; padding: 15px; font-weight: bold; font-size: 1.2em; position: fixed; top: 0; left: 0; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; backdrop-filter: blur(5px);">
    Oops, you're not logged in!
  </div>

  <button onclick="window.location.href='index.html'"
    style="margin: 10px; align-self: flex-start; position: relative; z-index: 10;">🔙Back to Home</button>

  <div class="login-box" id="loginSection">
    <h2>Login / Register</h2>

    <form onsubmit="return loginUser()">
      <input type="text" id="regFirstName" placeholder="First Name" required><br>
      <input type="text" id="regLastName" placeholder="Last Name" required><br>
      <input type="date" id="regDob" placeholder="Date Of Birth" required
        style="width: calc(100% - 22px); padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Outfit', sans-serif;"><br>
      <input type="email" id="regEmail" placeholder="Email" required><br>
      <div style="position: relative;">
        <input type="password" id="regPassword" placeholder="Password" required style="padding-right: 40px;">
        <span onclick="togglePassword('regPassword', this)"
          style="position: absolute; right: 10px; top: 40%; transform: translateY(-50%); cursor: pointer; font-size: 1.2em; user-select: none;">👁️</span>
      </div><br>
      <div style="position: relative;">
        <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required
          style="padding-right: 40px;">
        <span onclick="togglePassword('regConfirmPassword', this)"
          style="position: absolute; right: 10px; top: 40%; transform: translateY(-50%); cursor: pointer; font-size: 1.2em; user-select: none;">👁️</span>
      </div><br>
      <input type="tel" id="regPhone" placeholder="Phone Number" required><br>
      <input type="text" id="regAddress" placeholder="Address" required><br>
      <input type="text" id="regPincode" placeholder="Pincode" required><br>
      <p id="passwordError"
        style="color: pink; display: none; margin-top: -10px; margin-bottom: 10px; font-size: 0.9em; font-weight: 600;">
        Passwords do not match!</p>
      <button type="submit">Login</button>
    </form>
    <button>New user? Create account</button>
  </div>

  <div class="login-box" id="profileSection" style="display: none; width: 80%; max-width: 600px; margin-top: 50px;">
    <h2>Your Profile 👤</h2>
    <div
      style="text-align: left; background: rgba(255,255,255,0.6); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.8);">
      <p style="margin: 8px 0;"><strong>Name:</strong> <span id="profileName"></span></p>
      <p style="margin: 8px 0;"><strong>Email:</strong> <span id="profileEmail"></span></p>
      <p style="margin: 8px 0;"><strong>Phone:</strong> <span id="profilePhone"></span></p>
      <p style="margin: 8px 0;"><strong>Address:</strong> <span id="profileAddress"></span></p>
    </div>

    <h3 style="color: #d81b60;">Order History 📦</h3>
    <div id="orderHistoryContainer"
      style="text-align: left; background: rgba(255,255,255,0.6); padding: 20px; border-radius: 12px; max-height: 350px; overflow-y: auto; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.8);">
      <p>No orders yet.</p>
    </div>

    <button onclick="logoutUser()" style="background: #ff4757; color: white; width: 200px;">Sign Out 🚪</button>
  </div>

  <footer style="margin-top: auto; padding: 20px; text-align: center; color: #555; font-size: 0.9em; width: 100%;">
    Privacy | Terms & Conditions
  </footer>

  <script src="script.js"></script>
</body>

</html>
