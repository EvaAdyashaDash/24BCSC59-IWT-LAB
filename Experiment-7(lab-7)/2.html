<html>
<head>
<title>Application Form</title>
<body>
<h1 align="center">Application form</h1>
<table width=300 height=200 border=3 cellspacing=4 cellpadding=4 bgcolor="white">
<fieldset>
<tr>
<th colspan=4><center>Application Form</center></th></tr>
Personal Details
<tr>
<td>Applicant's full name</td>
<td><input type="text" placeholder="Name"</td>
<td> Care Of</td>
<td><input type="radio">parents
<input type="radio">guardian</td>
</tr>
<tr>
<td>Father's Name</td>
<td><input type="text" placeholder="Full name"</td>
<td>Mother's Name</td>
<td><input type="text" placeholder="full name"</td>
</tr>
<tr>
<td>Gender</td>
<td><input type="radio">male
<input type="radio">female
<input type="radio">others
</td>
<td>Date of birth</td>
<td><input type="date"></td>
</tr>
<tr>
<td>Marital Status</td>
<td><form><select name="select"><option value ="married">married <option value="unmarried">unmarried</option></select></form></td>
<td><form><select name="select"><option value="GEN">GEN <option value="SC/ST">SC/ST</option></select></form></td>
</tr>
<tr>
<td>Handicapped</td>
<td><input type="radio">No <input type="radio">Yes</td>
<td>ex-serviceman</td>
<td><input type="radio">No <input type="radio">Yes</td>
</tr>
<tr>
<td>EWS</td>
<td><input type="radio">No <input type="radio">Yes</td>
<td>Religion</td>
<td><form><select name="select"><option value="Hindu">Hindu <option value="Christian">Christian</option></select></form></td>
</tr>
</fieldset>

</table>
</body>
</html>
